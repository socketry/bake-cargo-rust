[package]
name = "bake-cargo"
version = "0.2.7"
edition = "2024"
license = "MIT"
repository = "https://github.com/socketry/bake-cargo-rust"
description = "Cargo project and release automation tasks for Bake"
readme = "readme.md"
include = ["src/**", "context/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[workspace]
members = ["bake"]
resolver = "3"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["socketry/managers"]

[lib]
name = "bake_cargo"

[dependencies]
socketry-markdown = "0.1.0"
bake = "0.17.0"
bake-releases = "0.2.1"
bake-license = "0.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", features = ["json"] }
tempfile = "3.27"
toml_edit = "0.25"
